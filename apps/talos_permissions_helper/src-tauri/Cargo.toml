[package]
name = "talos_permissions_helper"
version = "0.5.77"
edition = "2021"
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
talos_log_util = { path = "../../talos_log_util" }
talos_protocol = { path = "../../talos_protocol" }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-permission-flow = "0.1.40"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = "2.6.2"

[package.metadata]

[package.metadata.tauri]

[package.metadata.tauri.bundle]
icon = ["icons/icon.icns", "icons/icon.ico", "icons/icon.png"]

[lints]
workspace = true
