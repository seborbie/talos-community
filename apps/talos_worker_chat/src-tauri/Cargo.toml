[package]
name = "talos_worker_chat"
version = "0.6.100"
edition = "2021"
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1"
talos_log_util = { path = "../../talos_log_util" }
talos_protocol = { path = "../../talos_protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.5", features = [] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = "2.5.3"

[package.metadata]

[package.metadata.tauri]

[package.metadata.tauri.bundle]
icon = ["icons/icon.icns", "icons/icon.ico", "icons/icon.png"]

[lints]
workspace = true
