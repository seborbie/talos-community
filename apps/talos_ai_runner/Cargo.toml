[package]
name = "talos_ai_runner"
version = "0.1.5"
edition = "2021"
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["json"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
dotenvy = "0.15"
env-libvpx-sys = { version = "5.1.3", features = ["generate"] }
futures-util = "0.3"
png = "0.17.16"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
talos_protocol = { path = "../talos_protocol", features = ["relay-transport"] }
tokio = { version = "1.39", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
