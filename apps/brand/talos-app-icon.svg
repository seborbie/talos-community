<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Talos application icon</title>
  <desc id="desc">Three white rounded panels on a blue rounded-square field.</desc>
  <defs>
    <linearGradient id="field" x1="72" y1="56" x2="440" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55a7ff" />
      <stop offset="0.52" stop-color="#286cde" />
      <stop offset="1" stop-color="#123c9e" />
    </linearGradient>
    <linearGradient id="rim" x1="84" y1="64" x2="428" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9ddff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#4c8cff" stop-opacity="0.28" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#031334" flood-opacity="0.42" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#071632" />
  <rect x="34" y="34" width="444" height="444" rx="92" fill="url(#field)" filter="url(#shadow)" />
  <rect x="44" y="44" width="424" height="424" rx="82" fill="none" stroke="url(#rim)" stroke-width="8" />
  <g fill="none" stroke="#f8fbff" stroke-linecap="round" stroke-linejoin="round" stroke-width="26">
    <rect x="132" y="126" width="248" height="70" rx="25" />
    <rect x="132" y="221" width="248" height="70" rx="25" />
    <rect x="132" y="316" width="248" height="70" rx="25" />
  </g>
</svg>
