# Traefik file-provider routing for operator-supplied and local self-signed certificates. The one
# mounted full-chain certificate must cover all four configured DNS names.

http:
  routers:
    frontend-http:
      entryPoints:
        - web
      rule: 'Host({{ env "TALOS_FRONTEND_DOMAIN" | quote }})'
      service: frontend
      middlewares:
        - redirect-to-https
    api-http:
      entryPoints:
        - web
      rule: 'Host({{ env "TALOS_API_DOMAIN" | quote }})'
      service: api
      middlewares:
        - redirect-to-https
    control-http:
      entryPoints:
        - web
      rule: 'Host({{ env "TALOS_CONTROL_DOMAIN" | quote }})'
      service: control
      middlewares:
        - redirect-to-https

    frontend-https:
      entryPoints:
        - websecure
      rule: 'Host({{ env "TALOS_FRONTEND_DOMAIN" | quote }})'
      service: frontend
      middlewares:
        - response-security
      tls: {}
    api-https:
      entryPoints:
        - websecure
      rule: 'Host({{ env "TALOS_API_DOMAIN" | quote }})'
      service: api
      middlewares:
        - response-security
      tls: {}
    control-https:
      entryPoints:
        - websecure
      rule: 'Host({{ env "TALOS_CONTROL_DOMAIN" | quote }})'
      service: control
      middlewares:
        - response-security
      tls: {}

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        port: '{{ env "TALOS_EDGE_HTTPS_PORT" }}'
        permanent: true
    response-security:
      headers:
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin

  services:
    frontend:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://frontend:3000
    api:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://api_backend:3001
    control:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://talos_server:17110

tcp:
  routers:
    relay:
      entryPoints:
        - websecure
      rule: 'HostSNI({{ env "TALOS_RELAY_DOMAIN" | quote }})'
      service: relay
      tls: {}
  services:
    relay:
      loadBalancer:
        servers:
          - address: talos_relay:443

tls:
  certificates:
    - certFile: /certificates/talos-fullchain.pem
      keyFile: /certificates/talos-key.pem
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
