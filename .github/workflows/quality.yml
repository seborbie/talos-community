name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: 1.95.0
  VCPKG_COMMIT: d015e31e90838a4c9dfa3eed45979bc70d9357fc # signed 2026.05.25 release
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PUBLIC_API_URL: http://127.0.0.1:3001
  PUBLIC_RMM_API_URL: http://127.0.0.1:3002

jobs:
  bun:
    name: Bun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    defaults:
      run:
        working-directory: apps

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('apps/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-

      - name: Install locked dependencies
        run: |
          bun ci
          bun run third-party:vpx:prepare

      - name: Verify pinned toolchain
        run: bun run toolchain:check

      - name: Verify workspace and lockfile invariants
        run: bun run workspace:check

      - name: Verify frozen dependency resolution
        run: bun install --frozen-lockfile --dry-run

      - name: Run static checks
        run: bun run check

      - name: Verify installer PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            "../scripts/build-installers.ps1",
            "../scripts/New-CommunityManifestSigningCertificate.ps1",
            "../scripts/DevEnvironmentSecrets.ps1",
            "../scripts/VcpkgProvenance.ps1",
            "../scripts/Setup-DevEnviroment.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($error in $errors) {
                Write-Error "$path`: $($error.Message) at $($error.Extent.StartLineNumber):$($error.Extent.StartColumnNumber)"
              }
            }
          }
          if ($failed) {
            throw "Installer PowerShell syntax validation failed."
          }

      - name: Verify development secret generation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ../scripts/DevEnvironmentSecrets.ps1
          $first = New-TalosRandomSecret -Purpose "self_test" -ByteCount 32
          $second = New-TalosRandomSecret -Purpose "self_test" -ByteCount 32
          if ($first -eq $second) {
            throw "Independent secret generations returned the same value."
          }
          if ($first.Length -lt 59 -or $second.Length -lt 59) {
            throw "Generated development secrets are shorter than the required entropy contract."
          }

      - name: Verify vcpkg overlay provenance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ../scripts/VcpkgProvenance.ps1
          $fixture = Join-Path $env:RUNNER_TEMP "talos-vcpkg-provenance"
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Set-Content -LiteralPath (Join-Path $fixture "input.txt") -Value "first" -NoNewline
          $first = Get-TalosVcpkgProvenanceRecord -VcpkgCommit $env:VCPKG_COMMIT -OverlayPath $fixture -LibvpxVersion "1.13.1" -Triplets @("x64-windows", "x86-windows")
          Set-Content -LiteralPath (Join-Path $fixture "input.txt") -Value "second" -NoNewline
          $second = Get-TalosVcpkgProvenanceRecord -VcpkgCommit $env:VCPKG_COMMIT -OverlayPath $fixture -LibvpxVersion "1.13.1" -Triplets @("x64-windows", "x86-windows")
          if ($first -eq $second) {
            throw "Changing an overlay file did not change its provenance record."
          }

      - name: Run tests
        run: bun run test

      - name: Build production frontends
        run: bun run build

      - name: Reject tracked generated-file drift
        run: git diff --exit-code

  remediation-postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps
    env:
      DATABASE_URL: postgresql://talos_test:talos_test_password@127.0.0.1:5432/talos_test
      REMEDIATION_TEST_DATABASE_URL: postgresql://talos_test:talos_test_password@127.0.0.1:5432/talos_test
      COMMUNITY_REGISTRATION_TEST_DATABASE_URL: postgresql://talos_test:talos_test_password@127.0.0.1:5432/talos_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: talos_test
          POSTGRES_PASSWORD: talos_test_password
          POSTGRES_DB: talos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talos_test -d talos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun ci

      - name: Apply the complete database migration history
        run: bunx prisma migrate deploy --schema=api_backend/prisma/schema.prisma

      - name: Verify first-user registration and concurrent bootstrap
        run: >-
          bun test --preload ./api_backend/tests/setup.ts --isolate
          ./api_backend/tests/communityRegistrationPostgres.integration.test.ts

      - name: Verify remediation ownership and transition concurrency
        run: >-
          bun test --preload ./api_backend/tests/setup.ts --isolate
          ./api_backend/tests/remediationPostgres.integration.test.ts

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    defaults:
      run:
        working-directory: apps

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: rust-bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('apps/bun.lock') }}
          restore-keys: |
            rust-bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-

      - name: Install locked frontend build dependencies
        run: |
          bun ci
          bun run third-party:vpx:prepare

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustc --version --verbose
          cargo --version --verbose

      - name: Record runner image version
        id: runner_image
        shell: bash
        run: echo "version=${ImageVersion:-unknown}" >> "${GITHUB_OUTPUT}"

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libayatana-appindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libvpx-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libvpx llvm@18
          llvm_prefix="$(brew --prefix llvm@18)"
          echo "LIBCLANG_PATH=${llvm_prefix}/lib" >> "${GITHUB_ENV}"

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location $env:VCPKG_INSTALLATION_ROOT
          try {
            & git fetch --depth 1 origin $env:VCPKG_COMMIT
            if ($LASTEXITCODE -ne 0) { throw "Unable to fetch pinned vcpkg commit" }
            & git checkout --detach $env:VCPKG_COMMIT
            if ($LASTEXITCODE -ne 0) { throw "Unable to check out pinned vcpkg commit" }
            & .\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "Unable to bootstrap pinned vcpkg" }
          } finally {
            Pop-Location
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          $vpx_root = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          & $vcpkg install libvpx:x64-windows --overlay-ports="$env:GITHUB_WORKSPACE\scripts\vcpkg-overlays"
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VPX_INCLUDE_DIR=$(Join-Path $vpx_root 'include')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VPX_LIB_DIR=$(Join-Path $vpx_root 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VPX_VERSION=1.13.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner_image.outputs.version }}-${{ env.RUST_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('scripts/vcpkg-overlays/libvpx/**') }}-${{ hashFiles('apps/Cargo.lock') }}

      - name: Verify generated protocol contracts
        run: bun run contracts:check

      - name: Run Rust formatting and Clippy checks
        run: bun run check:rust

      - name: Run Rust tests
        run: bun run test:rust
