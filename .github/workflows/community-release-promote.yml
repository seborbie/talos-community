name: Community release prerelease promotion

on:
  workflow_dispatch:
    inputs:
      publication_run_id:
        description: Successful Community image and bundle publication workflow run ID
        required: true
        type: string
      release_tag:
        description: Annotated community-vX.Y.Z tag to publish as a prerelease
        required: true
        type: string
      test_evidence_url:
        description: HTTPS link to reviewed clean-host install/upgrade/rollback/restore/uninstall evidence
        required: true
        type: string
      test_evidence_sha256:
        description: Lowercase SHA-256 of the reviewed test-evidence package
        required: true
        type: string
      confirm_prerelease:
        description: Type PRERELEASE followed by a space and the exact release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: community-release-promote-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Validate explicit prerelease authorization and reviewed evidence
        id: identity
        working-directory: apps
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TEST_EVIDENCE_URL: ${{ inputs.test_evidence_url }}
          TEST_EVIDENCE_SHA256: ${{ inputs.test_evidence_sha256 }}
          CONFIRM_PRERELEASE: ${{ inputs.confirm_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRM_PRERELEASE}" = "PRERELEASE ${RELEASE_TAG}" ||
            { echo "prerelease confirmation does not exactly match" >&2; exit 1; }
          [[ "${TEST_EVIDENCE_URL}" =~ ^https://[A-Za-z0-9./?=_\&%:+#~-]+$ ]] ||
            { echo "test evidence must be one safe HTTPS URL" >&2; exit 1; }
          [[ "${TEST_EVIDENCE_SHA256}" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "test evidence must have a lowercase SHA-256" >&2; exit 1; }
          object_type="$(git -C .. cat-file -t "refs/tags/${RELEASE_TAG}")"
          source_sha="$(git -C .. rev-parse "${RELEASE_TAG}^{commit}")"
          bun ./scripts/community-release-version.ts \
            --tag "${RELEASE_TAG}" --source-sha "${source_sha}" \
            --ref-type tag --tag-object-type "${object_type}" \
            --github-output "${GITHUB_OUTPUT}"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLICATION_RUN_ID}")"
          test "$(jq -r .name <<<"${run_json}")" = \
            "Community release image and bundle publication"
          test "$(jq -r .conclusion <<<"${run_json}")" = success
          test "$(jq -r .head_sha <<<"${run_json}")" = "${source_sha}"

  promote:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: community-release-promotion
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: community-release-bundle-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/release
          run-id: ${{ inputs.publication_run_id }}
          github-token: ${{ github.token }}
      - name: Verify publication handoff, provenance, logs, and final artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release="${RUNNER_TEMP}/release"
          (cd "${release}" && sha256sum --check SHA256SUMS)
          while IFS= read -r -d '' artifact; do
            gh attestation verify "${artifact}" --repo "${GITHUB_REPOSITORY}"
          done < <(find "${release}" -maxdepth 1 -type f -print0)

          mkdir -p "${RUNNER_TEMP}/publication-logs"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.publication_run_id }}/logs" \
            > "${RUNNER_TEMP}/publication-logs.zip"
          unzip -q "${RUNNER_TEMP}/publication-logs.zip" \
            -d "${RUNNER_TEMP}/publication-logs"
          docker run --rm --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --volume "${RUNNER_TEMP}/publication-logs:/logs:ro" \
            "${GITLEAKS_IMAGE}" dir --config /repo/.gitleaks.toml \
            --max-archive-depth 8 --redact --no-banner --no-color /logs
          docker run --rm --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --volume "${release}:/release:ro" \
            "${GITLEAKS_IMAGE}" dir --config /repo/.gitleaks.toml \
            --max-archive-depth 8 --redact --no-banner --no-color /release
      - name: Create reviewed GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TEST_EVIDENCE_URL: ${{ inputs.test_evidence_url }}
          TEST_EVIDENCE_SHA256: ${{ inputs.test_evidence_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "a GitHub release already exists for ${RELEASE_TAG}; refusing overwrite" >&2
            exit 1
          fi
          release="${RUNNER_TEMP}/release"
          archive="$(find "${release}" -maxdepth 1 -type f \
            -name 'talos-community-*.tar.gz' -print -quit)"
          manifest="$(tar -xOf "${archive}" --wildcards '*/release-manifest.json')"
          fingerprint="$(jq -r '.signing.updaterManifestPublicKeySha256' <<<"${manifest}")"
          [[ "${fingerprint}" =~ ^[0-9a-f]{64}$ ]]
          notes="${RUNNER_TEMP}/RELEASE_NOTES.md"
          sed \
            -e 's/REPLACE_WITH_FULL_COMMIT_SHA/${{ needs.validate.outputs.source_sha }}/g' \
            -e "s/REPLACE_WITH_REVIEWED_FINGERPRINT/${fingerprint}/g" \
            -e 's|REPLACE_WITH_LINKS_OR_EXPLICIT_UNAVAILABLE_STATUS|GitHub artifact attestations verified before promotion|g' \
            .github/RELEASE_TEMPLATE.md > "${notes}"
          {
            echo
            echo "## Promotion evidence"
            echo
            echo "- Clean-host test evidence: ${TEST_EVIDENCE_URL}"
            echo "- Test-evidence SHA-256: \`${TEST_EVIDENCE_SHA256}\`"
            echo "- Publication workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.publication_run_id }}"
          } >> "${notes}"
          mapfile -d '' artifacts < <(find "${release}" -maxdepth 1 -type f -print0 | sort -z)
          gh release create "${RELEASE_TAG}" "${artifacts[@]}" \
            --prerelease --verify-tag \
            --title "Talos Community ${{ needs.validate.outputs.version }}" \
            --notes-file "${notes}"
