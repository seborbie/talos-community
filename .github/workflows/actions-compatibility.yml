name: Actions compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: actions-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Container tools and artifact handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Install and verify the pinned Buildx plugin
        id: verified-buildx
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/talos-community-docker
        run: |
          bash scripts/install-community-buildx.sh
          printf 'DOCKER_CONFIG=%s\n' "${DOCKER_CONFIG}" >> "${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: false
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Execute amd64 and emulated arm64 builds without publication
        shell: bash
        run: |
          set -euo pipefail
          context="${RUNNER_TEMP}/actions-compatibility"
          mkdir -p "${context}"
          cat > "${context}/Dockerfile" <<'DOCKERFILE'
          FROM oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
          RUN test "$(bun --version)" = '1.3.14'
          DOCKERFILE
          docker buildx build --platform linux/amd64,linux/arm64 --no-cache \
            --provenance=false --output "type=oci,dest=${RUNNER_TEMP}/compatibility.oci.tar" "${context}"
          tar -tf "${RUNNER_TEMP}/compatibility.oci.tar" > "${RUNNER_TEMP}/compatibility-files.txt"
          grep -qx 'index.json' "${RUNNER_TEMP}/compatibility-files.txt"
      - name: Prepare a synthetic archive handoff
        shell: bash
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/artifact-fixture"
          mkdir -p "${fixture}"
          printf 'Talos Actions compatibility fixture\n' > "${fixture}/payload.txt"
          python3 - "${fixture}" <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(root / 'bundle.zip', 'w') as archive:
              archive.write(root / 'payload.txt', 'payload.txt')
          PY
          printf 'Excluded synthetic hidden fixture\n' > "${fixture}/.hidden-fixture"
          (cd "${fixture}" && sha256sum payload.txt bundle.zip > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actions-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-fixture
          if-no-files-found: error
          archive: true
          include-hidden-files: false
          retention-days: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: actions-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-downloaded
      - name: Verify the downloaded archive and hidden-file policy
        shell: bash
        run: |
          set -euo pipefail
          downloaded="${RUNNER_TEMP}/artifact-downloaded"
          (cd "${downloaded}" && sha256sum --check SHA256SUMS)
          test ! -e "${downloaded}/.hidden-fixture"
          python3 - "${downloaded}" <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(root / 'bundle.zip') as archive:
              assert archive.namelist() == ['payload.txt']
              assert archive.read('payload.txt') == (root / 'payload.txt').read_bytes()
          PY
