name: Dependency security

on:
  pull_request:
    paths:
      - .github/workflows/security.yml
      - apps/bun.lock
      - apps/package.json
      - apps/*/package.json
      - apps/Cargo.lock
      - apps/Cargo.toml
      - apps/**/Cargo.toml
  push:
    branches:
      - main
    paths:
      - .github/workflows/security.yml
      - apps/bun.lock
      - apps/package.json
      - apps/*/package.json
      - apps/Cargo.lock
      - apps/Cargo.toml
      - apps/**/Cargo.toml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: 1.95.0
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Bun and RustSec audits
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Audit Bun lockfile
        run: bun run audit:js

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal

      - name: Restore Cargo audit cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/advisory-db
          key: cargo-audit-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        shell: bash
        run: |
          if ! cargo audit --version | grep -Fq "${CARGO_AUDIT_VERSION}"; then
            cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
          fi

      - name: Audit Cargo lockfile
        run: cargo audit
